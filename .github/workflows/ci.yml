name: CI
on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - 20.x
          - 24.x

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: use node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: run tests
        run: yarn test
